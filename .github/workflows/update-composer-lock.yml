name: Prepare PHP Dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - composer.json
      - .github/workflows/update-composer-lock.yml

permissions:
  contents: write

concurrency:
  group: prepare-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, exif, gd
          coverage: none

      - name: Resolve dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Format PHP code
        run: vendor/bin/pint

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock app bootstrap config database routes tests
          git commit -m "Prepare dependencies and format code [skip ci]"
          git pull --rebase origin main
          git push
