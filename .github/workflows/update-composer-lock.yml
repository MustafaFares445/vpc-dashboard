name: Update Composer Lock

on:
  push:
    branches: [main]
    paths:
      - composer.json
      - .github/workflows/update-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, exif, gd
          coverage: none

      - name: Resolve Composer dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Commit composer.lock
        run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Update Composer lock [skip ci]"
          git push
